  function editRole(id) {
    var opener = id ? invoke("roleplay.v1", "get", { id: id }) : Promise.resolve({ character: null });
    opener.then(function (res) {
      var c = res.character || {};
      var html = '<div class="field"><label>角色名</label><input id="rName" value="' + esc(c.name || "") + '"></div>' +
        '<div class="field"><label>人物设定 · 它是谁、什么来历</label><textarea id="rDesc">' + esc(c.description || "") + "</textarea></div>" +
        '<div class="field"><label>性格与说话方式</label><textarea id="rPers">' + esc(c.personality || "") + "</textarea></div>" +
        '<div class="field"><label>当前场景 · 在哪儿、正在发生什么</label><textarea id="rScene">' + esc(c.scenario || "") + "</textarea></div>" +
        '<div class="field"><label>开场白 · 启用时用它起个头</label><textarea id="rGreet">' + esc(c.greeting || "") + "</textarea></div>" +
        '<div class="field"><label>长期记忆 · 一条一行</label><textarea id="rMemo">' + esc(c.memory || "") + "</textarea></div>" +
        (c.id ? '<input type="hidden" id="rId" value="' + esc(c.id) + '">' : "");
      var ov = openModal(id ? "编辑角色" : "新建角色", "保存后拼进系统提示词", html,
        '<button class="btn" data-close>取消</button><button class="btn primary" id="rSave">保存</button>');
      ov.querySelector("#rSave").addEventListener("click", function () {
        var body = {
          id: (ov.querySelector("#rId") || {}).value || "",
          name: ov.querySelector("#rName").value,
          description: ov.querySelector("#rDesc").value,
          personality: ov.querySelector("#rPers").value,
          scenario: ov.querySelector("#rScene").value,
          greeting: ov.querySelector("#rGreet").value,
          memory: ov.querySelector("#rMemo").value
        };
        invoke("roleplay.v1", "save", body).then(function () {
          ov.remove();
          toast("角色已保存", "ok");
          return loadRole();
        }).catch(function (err) { toast("保存失败：" + err.message, "err"); });
      });
    });
  }
  function delRole(id) {
    confirmModal("删除角色", "删除后不可恢复。", "删除", function () {
      invoke("roleplay.v1", "delete", { id: id }).then(function () {
        toast("角色已删除", "ok");
        return loadRole();
      }).catch(function (err) { toast("删除失败：" + err.message, "err"); });
    });
  }

  /* =========================================================
   * 预算页
   * ========================================================= */
  function renderUsage() {
    contentEl.innerHTML = '<div class="center"><span class="spin"></span></div>';
  }
  function loadUsage() {
    invoke("usage.v1", "snapshot", {}).then(function (res) {
      S.usage.snap = res;
      renderUsagePage();
    }).catch(function (err) {
      contentEl.innerHTML = '<div class="page"><div class="pg-body"><div class="card"><div class="empty">' +
        '<div class="big">用量监控服务不可用</div><div>' + esc(err.message) + "</div></div></div></div></div>";
    });
  }
  function renderUsagePage() {
    var s = S.usage.snap || {};
    var t = s.totals || {};
    var b = s.balance || {};
    var hit = (s.hitRate || 0) * 100;
    var html = '<div class="page"><div class="pg-body">';
    html += '<div class="stat-grid">';
    html += statCard("余额", b.ok && b.available ? (b.total || "—") : "不可用", b.currency ? (b.currency + " · 更新于 " + esc(b.checkedAt || "")) : (b.err || "未配置 DeepSeek 密钥"), "grad");
    html += statCard("请求次数", t.requests || 0, (t.failed ? "失败 " + t.failed : "全部成功"));
    html += statCard("输入 tokens", fmtNum(t.promptTokens || 0), "prompt");
    html += statCard("输出 tokens", fmtNum(t.completionTokens || 0), "completion");
    html += statCard("总 tokens", fmtNum(t.totalTokens || 0), "累计");
    html += statCard("缓存命中率", hit.toFixed(1) + "%", (t.cacheHitTokens || 0) + " 命中 / " + (t.cacheMissTokens || 0) + " 未命中");
    html += "</div>";
    html += '<div class="usage-note">' + esc(s.note || "") + "<br>统计自 " + esc(t.since || "—") +
      (t.lastModel ? " · 最近模型 " + esc(t.lastModel) : "") + "</div>";
    html += "</div></div>";
    contentEl.innerHTML = html;
  }
  function statCard(k, v, sub, cls) {
    return '<div class="card stat"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || "") + '">' + esc(v) +
      '</div><div class="s">' + esc(sub || "") + "</div></div>";
  }

  /* =========================================================
   * 文生图页
   * ========================================================= */
  function renderImage() {
    var html = '<div class="page"><div class="pg-body"><div class="gen-layout">';
    html += '<div class="left"><div class="card gen-form">';
    html += '<div class="field"><label>描述想生成的画面</label><textarea id="imgPrompt" style="min-height:130px" placeholder="例：一只在极光下奔跑的白狐，雪地，电影感，高清"></textarea></div>';
    html += '<div class="field"><label>尺寸</label><select id="imgSize">' +
      '<option value="square_hd">方形 · square_hd</option>' +
      '<option value="square">方形 · square</option>' +
      '<option value="portrait_4_3">竖版 · 4:3</option>' +
      '<option value="portrait_16_9">竖版 · 16:9</option>' +
      '<option value="landscape_4_3">横版 · 4:3</option>' +
      '<option value="landscape_16_9">横版 · 16:9</option></select></div>';
    html += '<div class="field"><label>输出目录 <span class="kurl">（留空 = 工作区 generated-images）</span></label>' +
      '<input id="imgDir" placeholder="留空即可"></div>';
    html += '<div class="form-actions"><button class="btn primary" id="imgGo">生成</button></div>';
    html += '<div id="imgNote" class="kurl"></div>';
    html += "</div></div>";
    html += '<div class="right"><div id="imgRes">' +
      '<div class="gen-preview"><span style="font-size:12.5px;color:var(--text-3)">生成的图片会出现在这里</span></div></div></div>';
    html += "</div></div></div>";
    contentEl.innerHTML = html;
    var go = $("imgGo");
    if (go) go.addEventListener("click", genImage);
    var t = $("imgPrompt");
    if (t) t.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); genImage(); }
    });
  }
  function genImage() {
    var prompt = $("imgPrompt").value.trim();
    if (!prompt || S.img.busy) return;
    S.img.busy = true;
    var go = $("imgGo");
    if (go) go.disabled = true;
    var note = $("imgNote");
    if (note) note.textContent = "生成中…";
    invoke("imagegen.v1", "generate", {
      prompt: prompt,
      size: $("imgSize").value,
      dir: $("imgDir").value.trim() || undefined
    }).then(function (res) {
      var paths = res.paths || [];
      var html = '<div class="gen-res">';
      paths.forEach(function (p) {
        html += '<div class="gimg"><img src="/api/image?path=' + encodeURIComponent(p) + '" alt="generated">' +
          '<div class="gmeta">' + esc(p.split(/[\\/]/).pop()) + "</div></div>";
      });
      html += "</div>";
      $("imgRes").innerHTML = html;
      if (note) note.textContent = "已生成 " + paths.length + " 张 · " + (res.message || "") + " · " + (res.model || "");
    }).catch(function (err) {
      if (note) note.textContent = "生成失败：" + err.message;
      toast("生成失败：" + err.message, "err");
    }).finally(function () {
      S.img.busy = false;
      var b = $("imgGo");
      if (b) b.disabled = false;
    });
  }

  /* =========================================================
   * 全局事件绑定与启动
   * ========================================================= */
  window.__rescan = function () { S.plugins.detail = null; loadPlugins(); };
  window.__newPlugin = function () { openNewPlugin(); };
  window.__newRole = function () { editRole(""); };
  window.__togglePlugin = function (id, enable) {
    invoke("pluginManager.v1", "setEnabled", { id: id, enabled: enable }).then(function (res) {
      toast(res.note || (enable ? "已启用" : "已禁用"), "ok");
      return loadPlugins();
    }).catch(function (err) { toast("操作失败：" + err.message, "err"); });
  };
  window.__deletePlugin = function (id) {
    invoke("pluginManager.v1", "inspect", { id: id }).then(function (dt) {
      var warns = dt.warnings || [];
      var html = "<p style='font-size:13px'>将删除插件 <b>" + esc(dt.plugin && dt.plugin.name || id) + "</b> 的目录、配置与日志。</p>";
      if (warns.length) {
        html += '<div class="warnbox" style="margin-top:10px">' + warns.map(function (w) { return "<div>⚠ " + esc(w) + "</div>"; }).join("") + "</div>";
      }
      confirmModal("删除插件", html, "确认删除", function () {
        invoke("pluginManager.v1", "delete", { id: id }).then(function (res) {
          toast(res.note || "已删除", "ok");
          S.plugins.selectedId = null; S.plugins.detail = null;
          return loadPlugins();
        }).catch(function (err) { toast("删除失败：" + err.message, "err"); });
      });
    }).catch(function (err) { toast("读取插件信息失败：" + err.message, "err"); });
  };
  window.__reloadUsage = function () { loadUsage(); };

  function openNewPlugin() {
    var html = '<div class="mrow"><div class="field"><label>插件 ID · 反向域名</label><input id="npId" placeholder="com.example.calc"></div>' +
      '<div class="field"><label>名字</label><input id="npName" placeholder="计算器"></div></div>' +
      '<div class="field"><label>描述</label><input id="npDesc" placeholder="一句话说明它做什么"></div>' +
      '<div class="mrow"><div class="field"><label>运行时</label><select id="npRt"><option value="python">python</option><option value="go">go（需 builder 编译）</option></select></div>' +
      '<div class="field"><label>版本</label><input id="npVer" placeholder="1.0.0"></div></div>' +
      '<div class="field"><label>提供的服务 · 逗号分隔</label><input id="npProvides" placeholder="calc.v1"></div>' +
      '<div class="field"><label>入口代码 · 留空生成骨架</label><textarea id="npCode" style="min-height:90px" placeholder="可选；不填自动生成最小可用骨架"></textarea></div>';
    var ov = openModal("新建插件", "由平台生成规范骨架，重启后加载", html,
      '<button class="btn" data-close>取消</button><button class="btn primary" id="npGo">创建</button>');
    ov.querySelector("#npGo").addEventListener("click", function () {
      var provides = ov.querySelector("#npProvides").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var body = {
        id: ov.querySelector("#npId").value.trim(),
        name: ov.querySelector("#npName").value.trim(),
        description: ov.querySelector("#npDesc").value.trim(),
        version: ov.querySelector("#npVer").value.trim() || "1.0.0",
        runtime: ov.querySelector("#npRt").value,
        provides: provides,
        code: ov.querySelector("#npCode").value
      };
      invoke("pluginManager.v1", "create", body).then(function (res) {
        ov.remove();
        toast("插件已创建：" + (res.nextStep || "重启后生效"), "ok");
        return loadPlugins();
      }).catch(function (err) { toast("创建失败：" + err.message, "err"); });
    });
  }

  window.__craftPlugin = function () { openCraftModal(); };

  var CRAFT_EXAMPLES = [
    "一个掷骰子插件，可以指定面数，默认 6 面",
    "时间戳转换器：秒 / 毫秒时间戳与可读日期互转",
    "随机密码生成器，可指定长度、是否含符号"
  ];

  function openCraftModal() {
    var chips = CRAFT_EXAMPLES.map(function (t, i) {
      return '<button type="button" class="craft-chip" data-ex="' + i + '">' + esc(t) + "</button>";
    }).join("");
    var html =
      '<div class="field"><label>用一句话描述你要的插件</label>' +
      '<textarea id="cfIdea" class="craft-idea" rows="3" placeholder="例如：一个返回今天是星期几的插件"></textarea></div>' +
      '<div class="craft-ex">' + chips + "</div>" +
      '<div class="field" style="margin-top:10px"><label>语言</label>' +
      '<select id="cfLang"><option value="auto">自动选择（优先 Python，免编译）</option>' +
      '<option value="python">Python（写完即装）</option>' +
      '<option value="go">Go（编译为原生可执行文件）</option></select></div>' +
      '<div class="craft-note">AI 会先研读平台的插件规则与完整骨架，再自动生成代码、写入插件目录；' +
      "Go 插件编译报错时会自动修改重试。完成后<b>一键重启</b>即安装。<br>" +
      "⚠ 生成的插件会以子进程方式<b>在本机运行</b>，请确认需求来自可信输入。</div>" +
      '<div class="craft-progress" id="cfProg" style="display:none"></div>';
    var ov = openModal("✨ 一键造插件", "说句话，AI 自己读规则、写代码、装上线", html,
      '<button class="btn" data-close>取消</button><button class="btn primary" id="cfGo">开始制造</button>');
    ov.querySelector("#cfGo").addEventListener("click", function () {
      submitCraft(ov);
    });
    Array.prototype.forEach.call(ov.querySelectorAll(".craft-chip"), function (c) {
      c.addEventListener("click", function () {
        ov.querySelector("#cfIdea").value = CRAFT_EXAMPLES[+c.dataset.ex];
        ov.querySelector("#cfIdea").focus();
      });
    });
    // 恢复正在进行 / 刚完成的任务（页面刷新或重新打开弹窗时）
    fetch("/api/craft")
      .then(function (r) { return r.json(); })
      .then(function (st) {
        if (st && (st.running || st.done || st.error)) {
          S.craft = st;
          bindCraftModal(ov);
          renderCraftProgress(ov);
          ov.querySelector("#cfGo").disabled = !!st.running;
        }
      })
      .catch(function () {});
  }

  function submitCraft(ov) {
    var idea = ov.querySelector("#cfIdea").value.trim();
    if (!idea) { toast("先描述一下你要什么插件", "err"); return; }
    var lang = ov.querySelector("#cfLang").value;
    var goBtn = ov.querySelector("#cfGo");
    goBtn.disabled = true;
    // 本地先摆一个起步帧，SSE 首帧到达后整体替换
    S.craft = { running: true, steps: [{ key: "rules", title: "正在启动流水线…", state: "running" }] };
    bindCraftModal(ov);
    renderCraftProgress(ov);
    fetch("/api/craft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idea: idea, lang: lang })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) {
        var msg = res.j && res.j.error && res.j.error.message || "制造请求被拒绝";
        S.craft = { running: false, error: msg, steps: [] };
        renderCraftProgress(ov);
      }
    }).catch(function (err) {
      S.craft = { running: false, error: String(err), steps: [] };
      renderCraftProgress(ov);
    });
  }

  // bindCraftModal 把进度帧渲染挂到 SSE craft 事件回调上。
  function bindCraftModal(ov) {
    window.__craftModalActive = function () {
      if (!document.body.contains(ov)) { window.__craftModalActive = null; return; }
      renderCraftProgress(ov);
    };
  }

  function craftIcon(state) {
    if (state === "ok") return '<span class="ci ci-ok">✓</span>';
    if (state === "fail") return '<span class="ci ci-fail">✗</span>';
    if (state === "running") return '<span class="ci ci-run spin"></span>';
    return '<span class="ci ci-wait">○</span>';
  }

  function renderCraftProgress(ov) {
    var st = S.craft;
    var prog = ov.querySelector("#cfProg");
    var formArea = ov.querySelector(".craft-ex");
    if (!st || !(st.running || st.done || st.error)) return;
    // 进入进度态：锁表单、隐藏取消外的操作
    ov.querySelector("#cfIdea").disabled = true;
    ov.querySelector("#cfLang").disabled = true;
    Array.prototype.forEach.call(ov.querySelectorAll(".craft-chip"), function (c) { c.disabled = true; });
    formArea.style.display = "none";
    prog.style.display = "";
    var goBtn = ov.querySelector("#cfGo");
    if (goBtn) goBtn.style.display = "none";

    var html = "";
    if (st.steps && st.steps.length) {
      html += '<div class="craft-steps">' + st.steps.map(function (s) {
        var note = s.note ? '<div class="cs-note">' + esc(s.note) + "</div>" : "";
        return '<div class="cstep cs-' + s.state + '">' + craftIcon(s.state) +
          '<div class="cs-body"><div class="cs-title">' + esc(s.title) + "</div>" + note + "</div></div>";
      }).join("") + "</div>";
    }

    var actions = ov.querySelector(".mactions");
    if (st.done && st.plugin) {
      var p = st.plugin;
      var methodsLine = "";
      if ((p.methods || []).length) {
        var svc = (p.provides || [])[0] || "";
        methodsLine = '<div class="cd-row">方法：' +
          p.methods.map(function (m) {
            return '<span class="tag blue">' + esc(svc + (svc ? " / " : "") + m) + "</span>";
          }).join(" ") +
          ' <span class="cd-tip" style="display:inline">（调用时服务名填前者、方法名填后者）</span></div>';
      }
      html += '<div class="craft-done"><div class="cd-title">✨ 插件已就绪</div>' +
        '<div class="cd-row"><b>' + esc(p.name) + "</b> <span class=\"cd-id\">" + esc(p.id) + "</span></div>" +
        '<div class="cd-row">服务：' + esc((p.provides || []).join(", ") || "—") + "</div>" +
        methodsLine +
        '<div class="cd-row">目录：plugins/' + esc(p.dir) + " · 写入 " + (p.files || []).length + " 个文件</div>" +
        '<div class="cd-tip">重启平台约 10 秒，完成后自动回到插件页，新插件默认启用。</div></div>';
      actions.innerHTML = '<button class="btn" data-close>稍后安装</button>' +
        '<button class="btn primary" id="cfInstall">✨ 立即安装（重启平台）</button>';
      actions.querySelector("#cfInstall").addEventListener("click", function () {
        ov.remove();
        window.__craftModalActive = null;
        restartPlatform();
      });
    } else if (st.error) {
      html += '<div class="craft-err"><b>制造失败</b><pre>' + esc(st.error) + "</pre></div>";
      actions.innerHTML = '<button class="btn" data-close>关闭</button>' +
        '<button class="btn primary" id="cfRetry">换个说法再试</button>';
      actions.querySelector("#cfRetry").addEventListener("click", function () {
        ov.remove();
        window.__craftModalActive = null;
        S.craft = null;
        openCraftModal();
      });
    }
    prog.innerHTML = html;
  }

  /* ---------- demo 降级 ---------- */
  function demo() {
    S.demo = true;
    S.chat.sessionId = "demo";
    S.chat.name = "演示 · 聊聊新插件";
    S.chat.sessions = [
      { sessionId: "demo", name: "聊聊新插件", nodes: 5 },
      { sessionId: "demo2", name: "读一下 go.mod", nodes: 3 }
    ];
    S.chat.path = [
      { role: "user", text: "帮我写一个回显插件的 manifest", at: "15:03:12" },
      { role: "assistant", via: "session.v1", at: "15:03:18", text: "好的，最小回显插件长这样：\n\n```json\n{\n  \"id\": \"com.example.echo\",\n  \"provides\": [\"echo.v1\"],\n  \"runtime\": \"python\"\n}\n```\n\n再配上 `main.py` 即可。**要点**：\n\n- `runtime` 决定用哪个解释器\n- 服务名必须带版本后缀" },
      { role: "assistant", via: "session.v1", at: "15:03:25", text: "需要我继续讲讲 Python 骨架怎么写吗？" }
    ];
    S.chat.services = [
      { name: "conversation.v1", alive: true }, { name: "session.v1", alive: true },
      { name: "agent.v1", alive: true }, { name: "llm.v1", alive: true }
    ];
    S.chat.model = "mock · 演示";
    setStatus(false, "演示模式（后端未连接）");
    $("demoTag").style.display = "";
    renderTopbar();
    renderChat();
  }

  /* ---------- 启动 ---------- */
  Array.prototype.forEach.call(navEl.querySelectorAll(".item"), function (it) {
    it.addEventListener("click", function () { navTo(it.dataset.page); });
  });
  $("newBtn").addEventListener("click", function () {
    postSession("new", "").catch(function () {});
  });
  $("settingsBtn").addEventListener("click", openSettings);

  connectStream();
  loadState().catch(function () { demo(); });
  navTo("chat");
})();
</script>
